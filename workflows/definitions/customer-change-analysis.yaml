id: customer-change-analysis
name: Customer Change Analysis
version: 0.1.0

trigger:
  type: manual

inputs:
  - source_documents
  - target_project

steps:
  - id: parse-documents
    executor: document-ingestion
    implementation_state: IMPLEMENTED
    actions:
      - preserve-source
      - calculate-sha256
      - extract-normalized-text

  - id: extract-requirements
    executor: deterministic
    action: first-pass-requirement-draft
    implementation_state: IMPLEMENTED
    depends_on:
      - parse-documents

  - id: review-requirements
    executor: human-approval
    implementation_state: PENDING
    depends_on:
      - extract-requirements

  - id: analyze-impact
    executor: ai
    skill: impact-analysis
    implementation_state: PENDING
    depends_on:
      - review-requirements

  - id: generate-design
    executor: ai
    skill: system-design
    implementation_state: PENDING
    depends_on:
      - analyze-impact

  - id: plan-implementation
    executor: ai
    skill: implementation-planning
    implementation_state: PENDING
    depends_on:
      - generate-design

  - id: build-agent-context
    executor: deterministic
    action: agent-context-package
    implementation_state: PENDING
    depends_on:
      - plan-implementation

outputs:
  - extracted_requirements
  - clarification_questions
  - impact_report
  - design_proposal
  - implementation_plan
  - agent_context_package

audit:
  record_inputs: true
  record_outputs: true
  record_model_usage: true
  measure_time_saved: true
